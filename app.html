<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G7</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#151312;
      --border: rgba(255,255,255,.10);
      --text:#fff;
      --muted: rgba(255,255,255,.72);
      --accent:#ef6f2e;
      --shadow: 0 18px 60px rgba(0,0,0,.45);
      --r:22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:"Nunito",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(239,111,46,.18), transparent 60%),
        radial-gradient(900px 520px at 85% 10%, rgba(255,255,255,.06), transparent 55%),
        var(--bg);
      min-height:100svh;
      display:grid;
      place-items:center;
      padding:18px;
      color:var(--text);
    }
    .card{
      width:min(820px, 100%);
      border:1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border-radius: var(--r);
      box-shadow: var(--shadow);
      padding:22px;
    }
    .top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border-bottom:1px solid rgba(255,255,255,.08);
      padding-bottom:14px;
      margin-bottom:14px;
    }
    h1{
      margin:0;
      font-size:28px;
      letter-spacing:.2px;
    }
    .right{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .pill{
      padding:8px 10px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(0,0,0,.18);
      color:var(--muted);
      font-size:13px;
      white-space:nowrap;
    }
    .btn{
      padding:10px 14px;
      border-radius:14px;
      border:1px solid rgba(239,111,46,.35);
      background: linear-gradient(180deg, rgba(239,111,46,.95), rgba(239,111,46,.78));
      color:#140f0d;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
    }
    .btn[disabled]{ opacity:.6; cursor:not-allowed; }

    .content{
      display:grid;
      gap:12px;
    }
    .box{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      border-radius:16px;
      padding:14px;
      color:var(--muted);
      font-size:14px;
    }
    .ok{ border-color: rgba(90,255,145,.25); color: rgba(220,255,235,.95); }
    .err{ border-color: rgba(255,90,90,.25); color: rgba(255,220,220,.95); }
  </style>
</head>

<body>
  <div class="card">
    <div class="top">
      <h1>G7</h1>

      <div class="right">
        <div class="pill" id="userPill">Проверяю сессию…</div>
        <button class="btn" id="logout" disabled>Выйти</button>
      </div>
    </div>

    <div class="content">
      <div class="box" id="statusBox">Загрузка…</div>
      <div class="box">
        Это защищённая зона. Следующим шагом переносим «Главную» с Google Sites и делаем плитки/разделы.
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const SUPABASE_URL = "https://lnmhhdgbfbwkvyeuojra.supabase.co";
    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubWhoZGdiZmJ3a3Z5ZXVvanJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MzY4MzYsImV4cCI6MjA4MzIxMjgzNn0.yia-zzBLtLkgPsAOyFFEYu6wiShLGnaaayjVegVydGo";

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const userPill = document.getElementById("userPill");
    const statusBox = document.getElementById("statusBox");
    const logoutBtn = document.getElementById("logout");

    function setStatus(text, kind=""){
      statusBox.className = "box" + (kind ? " " + kind : "");
      statusBox.textContent = text;
    }

    // 🔒 Guard: если нет сессии — на логин
    const { data, error } = await supabase.auth.getSession();
    if (error) {
      // если что-то совсем не так — тоже на логин
      window.location.replace("./index.html");
    }

    if (!data?.session) {
      window.location.replace("./index.html");
    } else {
      const email = data.session.user?.email || "user";
      userPill.textContent = email;
      setStatus("Сессия активна ✅", "ok");
      logoutBtn.disabled = false;
    }

    // 🚪 Выход
    logoutBtn.addEventListener("click", async () => {
      logoutBtn.disabled = true;
      setStatus("Выходим…");
      await supabase.auth.signOut();
      window.location.replace("./index.html");
    });

    // (необязательно, но полезно) — реакция на изменения сессии
    supabase.auth.onAuthStateChange((_event, session) => {
      if (!session) window.location.replace("./index.html");
    });
  </script>
</body>
</html>
