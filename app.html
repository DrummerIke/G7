<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>G7</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
    const APP_VERSION = "2026-05-31-login-fallback-1";
    const storedVersion = localStorage.getItem("g7:version");
    if (storedVersion !== APP_VERSION) {
      localStorage.setItem("g7:version", APP_VERSION);
      const nextUrl = new URL(window.location.href);
      nextUrl.searchParams.set("v", APP_VERSION);
      if ("caches" in window) {
        caches.keys()
          .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
          .finally(() => window.location.replace(nextUrl.toString()));
      } else {
        window.location.replace(nextUrl.toString());
      }
    }
  </script>
</head>
<body>
  <script>
    // app.html остаётся точкой входа после логина
    // а реальный контент живёт в pages/home.html
    window.location.replace("./pages/home.html");
  </script>
</body>
</html>
