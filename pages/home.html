<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G7</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#151312;
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:rgba(255,255,255,.65);
  --accent:#ef6f2e;
  --r:20px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Nunito,system-ui;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(239,111,46,.20), transparent 60%),
    var(--bg);
  min-height:100svh;
}

/* ===== Preloader ===== */
#loading{
  position:fixed; inset:0;
  display:grid; place-items:center;
  background:var(--bg);
  z-index:10;
}
.spinner{
  width:36px;height:36px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== Topbar ===== */
.topbar{
  max-width:1200px;
  margin:14px auto;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border:1px solid var(--border);
  border-radius:var(--r);
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
}

/* Logo */
.logo{
  display:flex;
  align-items:center;
}
.logo img{
  height:44px;
  width:auto;
}

/* Nav icons */
.nav{
  display:flex;
  align-items:center;
  gap:14px;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:rgba(0,0,0,.25);
  cursor:pointer;
  transition:.15s;
}
.iconBtn:hover{
  background:rgba(239,111,46,.15);
  border-color:rgba(239,111,46,.4);
}
.iconBtn svg{
  width:20px;height:20px;
  stroke:white;
  fill:none;
  stroke-width:2;
}

/* Settings menu */
.settings{
  position:relative;
}
.menu{
  position:absolute;
  right:0;
  top:52px;
  min-width:160px;
  background:#1b1918;
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
  display:none;
}
.settings:hover .menu{display:block}
.menu button{
  width:100%;
  background:none;
  border:none;
  color:var(--text);
  padding:10px 12px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
}
.menu button:hover{
  background:rgba(239,111,46,.15);
}
</style>
</head>

<body>
<div id="loading"><div class="spinner"></div></div>

<div class="topbar" id="app" style="display:none">
  <div class="logo">
    <img src="./Logo.png" alt="G7" />
  </div>

  <div class="nav">
    <!-- Бутики -->
    <div class="iconBtn" title="Бутики">
      <svg viewBox="0 0 24 24"><path d="M3 7h18M5 7l1-3h12l1 3M5 10v10M9 10v10M15 10v10M19 10v10"/></svg>
    </div>

    <!-- Контакты -->
    <div class="iconBtn" title="Контакты">
      <svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M9 6h6M9 18h6"/></svg>
    </div>

    <!-- Инструкции -->
    <div class="iconBtn" title="Инструкции">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    </div>

    <!-- Settings -->
    <div class="settings">
      <div class="iconBtn" title="Настройки">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.4-2.3.7a7.6 7.6 0 0 0-1.7-1L15 4h-6l-.5 3.1a7.6 7.6 0 0 0-1.7 1L4.5 7.4l-2 3.4L4.5 12a7.8 7.8 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.7a7.6 7.6 0 0 0 1.7 1L9 22h6l.5-3.1a7.6 7.6 0 0 0 1.7-1l2.3.7 2-3.4z"/></svg>
      </div>
      <div class="menu">
        <button>Личный кабинет</button>
        <button id="logout">Выйти</button>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://lnmhhdgbfbwkvyeuojra.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubWhoZGdiZmJ3a3Z5ZXVvanJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MzY4MzYsImV4cCI6MjA4MzIxMjgzNn0.yia-zzBLtLkgPsAOyFFEYu6wiShLGnaaayjVegVydGo"
);

const { data } = await supabase.auth.getSession();
if(!data.session) location.replace("../index.html");

document.getElementById("loading").style.display="none";
document.getElementById("app").style.display="flex";

document.getElementById("logout").onclick = async ()=>{
  await supabase.auth.signOut();
  location.replace("../index.html");
};
</script>
</body>
</html>
