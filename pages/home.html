<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>G7</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script>
  const APP_VERSION = "2026-05-31-roles-1";
  const storedVersion = localStorage.getItem("g7:version");
  if (storedVersion !== APP_VERSION) {
    localStorage.setItem("g7:version", APP_VERSION);
    const nextUrl = new URL(window.location.href);
    nextUrl.searchParams.set("v", APP_VERSION);
    if ("caches" in window) {
      caches.keys()
        .then((keys) => Promise.all(keys.map((key) => caches.delete(key))))
        .finally(() => window.location.replace(nextUrl.toString()));
    } else {
      window.location.replace(nextUrl.toString());
    }
  }
</script>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#151312;
  --border:rgba(255,255,255,.10);
  --text:#fff;
  --muted:rgba(255,255,255,.65);
  --accent:#ef6f2e;
  --accent-soft:rgba(239,111,46,.12);
  --panel:linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
  --r:20px;

  --icon-size:46px;
  --icon-radius:15px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Nunito,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 15% -10%, rgba(239,111,46,.20), transparent 60%),
    radial-gradient(900px 520px at 90% 5%, rgba(255,255,255,.07), transparent 55%),
    var(--bg);
  min-height:100svh;
}

/* ===== Preloader ===== */
#loading{
  position:fixed; inset:0;
  display:grid; place-items:center;
  background:var(--bg);
  z-index:10;
}
.spinner{
  width:36px;height:36px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,.2);
  border-top-color:var(--accent);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.shell{
  width:min(1200px, calc(100% - 28px));
  margin:14px auto 36px;
}

/* ===== Topbar ===== */
.topbar{
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  border:1px solid var(--border);
  border-radius:var(--r);
  background:var(--panel);
  box-shadow:0 18px 60px rgba(0,0,0,.24);
}

.logo{
  display:flex;
  align-items:center;
  background:transparent !important;
  border:none !important;
  padding:0;
  text-decoration:none;
}
.logo img{
  height:128px;
  width:auto;
  display:block;
  background:transparent !important;
  box-shadow:none !important;
  transform:translateZ(0);
  transition:transform .18s ease, filter .18s ease, opacity .18s ease;
  opacity:.98;
}
.logo:hover img{
  transform:translateY(-1px) scale(1.02);
  filter:drop-shadow(0 10px 26px rgba(239,111,46,.18));
  opacity:1;
}

.nav{
  display:flex;
  align-items:center;
  gap:14px;
  margin-left:auto;
  flex-wrap:wrap;
  justify-content:flex-end;
}
.iconBtn{
  width:var(--icon-size);
  height:var(--icon-size);
  border-radius:var(--icon-radius);
  display:grid;
  place-items:center;
  border:1px solid var(--border);
  background:rgba(0,0,0,.25);
  cursor:pointer;
  transition:background .15s ease, border-color .15s ease, transform .15s ease;
  user-select:none;
  color:var(--text);
}
.iconBtn:hover{
  background:rgba(239,111,46,.12);
  border-color:rgba(239,111,46,.38);
  transform:translateY(-1px);
}
.iconBtn:active{transform:translateY(0)}
.iconBtn svg{
  width:21px;height:21px;
  stroke:currentColor;
  fill:none;
  stroke-width:2;
  opacity:.95;
}
.iconBtn.active{
  background:rgba(239,111,46,.18);
  border-color:rgba(239,111,46,.55);
  box-shadow:0 0 0 3px rgba(239,111,46,.10);
}
.settings{position:relative;}
.menu{
  position:absolute;
  right:0;
  top:56px;
  min-width:220px;
  background:#1b1918;
  border:1px solid var(--border);
  border-radius:14px;
  padding:6px;
  display:none;
  z-index:3;
}
.settings:hover .menu,
.settings:focus-within .menu{display:block}
.menu button{
  width:100%;
  background:none;
  border:none;
  color:var(--text);
  padding:10px 12px;
  border-radius:10px;
  text-align:left;
  cursor:pointer;
  font:inherit;
}
.menu button:hover{background:rgba(239,111,46,.15)}

.hero{
  margin-top:18px;
  display:grid;
  grid-template-columns:minmax(0, 1.2fr) minmax(280px, .8fr);
  gap:18px;
}
.card{
  border:1px solid var(--border);
  border-radius:var(--r);
  background:var(--panel);
  padding:22px;
  box-shadow:0 18px 60px rgba(0,0,0,.18);
}
.eyebrow{
  margin:0 0 8px;
  color:var(--accent);
  font-size:13px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
}
h1{
  margin:0;
  font-size:clamp(28px, 5vw, 48px);
  line-height:1.05;
}
.lead{
  margin:14px 0 0;
  color:var(--muted);
  font-size:16px;
  line-height:1.55;
}
.profileGrid{
  display:grid;
  gap:12px;
}
.infoRow{
  padding:12px 14px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(0,0,0,.18);
}
.infoRow span{
  display:block;
  color:var(--muted);
  font-size:12px;
  margin-bottom:4px;
}
.infoRow strong{font-size:15px}

.sectionTitle{
  margin:28px 0 14px;
  font-size:22px;
}
.branchGrid{
  display:grid;
  grid-template-columns:repeat(2, minmax(0,1fr));
  gap:16px;
}
.branchCard{
  min-height:210px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  border:1px solid var(--border);
  border-radius:var(--r);
  background:var(--panel);
  padding:20px;
  text-decoration:none;
  color:var(--text);
  transition:transform .16s ease, border-color .16s ease, background .16s ease;
}
.branchCard:hover{
  transform:translateY(-2px);
  border-color:rgba(239,111,46,.45);
  background:linear-gradient(180deg, rgba(239,111,46,.10), rgba(255,255,255,.025));
}
.branchTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
}
.branchIcon{
  width:54px;
  height:54px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:var(--accent-soft);
  border:1px solid rgba(239,111,46,.25);
  flex:none;
}
.branchIcon svg{
  width:26px;
  height:26px;
  stroke:var(--accent);
  fill:none;
  stroke-width:2;
}
.branchCard h2{
  margin:16px 0 8px;
  font-size:24px;
}
.branchCard p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
}
.rolePill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  width:max-content;
  max-width:100%;
  margin-top:18px;
  padding:8px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  color:rgba(255,255,255,.78);
  font-size:13px;
}
.emptyState{
  border:1px dashed rgba(239,111,46,.35);
  border-radius:var(--r);
  background:rgba(239,111,46,.08);
  padding:20px;
  color:rgba(255,255,255,.86);
}

@media (max-width:800px){
  .shell{width:min(100% - 20px, 1200px); margin-top:10px}
  .topbar{padding:12px; align-items:flex-start}
  .logo img{height:74px}
  .nav{gap:10px}
  :root{--icon-size:42px}
  .hero{grid-template-columns:1fr}
  .branchGrid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div id="loading"><div class="spinner"></div></div>

<main class="shell" id="app" style="display:none">
  <header class="topbar">
    <a class="logo" href="./home.html" title="На главную">
      <img src="./Logo.png" alt="G7" />
    </a>

    <div class="nav" id="nav" aria-label="Основные разделы"></div>
  </header>

  <section class="hero">
    <div class="card">
      <p class="eyebrow">G7 workspace</p>
      <h1 id="welcomeTitle">Главная страница</h1>
      <p class="lead" id="welcomeText">Загружаем доступные разделы относительно вашей роли.</p>
    </div>

    <aside class="card profileGrid" aria-label="Профиль пользователя">
      <div class="infoRow">
        <span>Пользователь</span>
        <strong id="profileName">—</strong>
      </div>
      <div class="infoRow">
        <span>Роль</span>
        <strong id="profileRole">—</strong>
      </div>
      <div class="infoRow">
        <span>Направление</span>
        <strong id="profileBranch">—</strong>
      </div>
    </aside>
  </section>

  <h2 class="sectionTitle">Доступные направления</h2>
  <section class="branchGrid" id="branchGrid" aria-live="polite"></section>
</main>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const supabase = createClient(
  "https://lnmhhdgbfbwkvyeuojra.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxubWhoZGdiZmJ3a3Z5ZXVvanJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njc2MzY4MzYsImV4cCI6MjA4MzIxMjgzNn0.yia-zzBLtLkgPsAOyFFEYu6wiShLGnaaayjVegVydGo"
);

const ROLE_LABELS = {
  admin: "Администратор",
  division_director: "Дивизиональный директор",
  boutique_director: "Директор бутика",
  personal_consultant: "Персональный консультант",
  online_boutique_director: "Директор интернет-бутика",
  online_boutique_manager: "Менеджер интернет-бутика",
  group_leader: "Лидер группы",
  online_personal_consultant: "Персональный консультант интернет-бутика"
};

const BRANCH_LABELS = {
  boutiques: "Бутики",
  online_boutique: "Интернет-бутик"
};

const BRANCHES = [
  {
    id: "boutiques",
    title: "Бутики",
    href: "./boutiques.html",
    description: "Операционная работа розничных бутиков: команда, задачи, документы и показатели.",
    roles: ["admin", "division_director", "boutique_director", "personal_consultant"],
    icon: `<path d="M3 7h18M5 7l1-3h12l1 3M5 10v10M9 10v10M15 10v10M19 10v10"/>`
  },
  {
    id: "online_boutique",
    title: "Интернет-бутик",
    href: "./internet-boutique.html",
    description: "Рабочее пространство интернет-бутика: лиды, заказы, команда и задачи онлайн-направления.",
    roles: ["admin", "online_boutique_director", "online_boutique_manager", "group_leader", "online_personal_consultant"],
    icon: `<path d="M4 5h16v10H4z"/><path d="M8 21h8M12 15v6"/><path d="M8 9h8"/>`
  }
];

const SETTINGS_ITEM = {
  id: "settings",
  title: "Настройки",
  icon: `<circle cx="12" cy="12" r="3"/><path d="M19.4 15a7.8 7.8 0 0 0 .1-2l2-1.2-2-3.4-2.3.7a7.6 7.6 0 0 0-1.7-1L15 4h-6l-.5 3.1a7.6 7.6 0 0 0-1.7 1L4.5 7.4l-2 3.4L4.5 12a7.8 7.8 0 0 0 .1 2l-2 1.2 2 3.4 2.3-.7a7.6 7.6 0 0 0 1.7 1L9 22h6l.5-3.1a7.6 7.6 0 0 0 1.7-1l2.3.7 2-3.4z"/>`
};

const loading = document.getElementById("loading");
const app = document.getElementById("app");
const nav = document.getElementById("nav");
const branchGrid = document.getElementById("branchGrid");

function normalizeRole(role) {
  return String(role || "").trim().toLowerCase();
}

function getMetadataProfile(user) {
  const metadata = { ...user.app_metadata, ...user.user_metadata };
  return {
    full_name: metadata.full_name || metadata.name || user.email || "Пользователь G7",
    role: normalizeRole(metadata.role) || "division_director",
    branch: metadata.branch || metadata.direction || "boutiques",
    is_active: metadata.is_active !== false
  };
}

async function loadProfile(user) {
  const fallbackProfile = getMetadataProfile(user);

  const { data, error } = await supabase
    .from("profiles")
    .select("full_name, role, branch, is_active")
    .eq("id", user.id)
    .maybeSingle();

  if (error || !data) return fallbackProfile;

  return {
    full_name: data.full_name || fallbackProfile.full_name,
    role: normalizeRole(data.role) || fallbackProfile.role,
    branch: data.branch || fallbackProfile.branch,
    is_active: data.is_active !== false
  };
}

function canSeeBranch(profile, branch) {
  return branch.roles.includes(profile.role);
}

function renderIcon(icon) {
  return `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg>`;
}

function renderNav(availableBranches) {
  nav.innerHTML = availableBranches.map((branch) => `
    <a class="iconBtn" data-target="${branch.id}" href="${branch.href}" title="${branch.title}" aria-label="${branch.title}">
      ${renderIcon(branch.icon)}
    </a>
  `).join("") + `
    <div class="settings">
      <button class="iconBtn" type="button" data-target="${SETTINGS_ITEM.id}" title="${SETTINGS_ITEM.title}" aria-label="${SETTINGS_ITEM.title}">
        ${renderIcon(SETTINGS_ITEM.icon)}
      </button>
      <div class="menu">
        <button type="button" id="profile">Личный кабинет</button>
        <button type="button" id="logout">Выйти</button>
      </div>
    </div>
  `;

  document.getElementById("logout").onclick = async () => {
    await supabase.auth.signOut();
    location.replace("../index.html");
  };

  document.getElementById("profile").onclick = () => {
    alert("Личный кабинет добавим следующим шагом.");
  };
}

function renderBranches(profile, availableBranches) {
  if (!availableBranches.length) {
    branchGrid.innerHTML = `
      <div class="emptyState">
        Для роли «${ROLE_LABELS[profile.role] || profile.role || "не назначена"}» пока нет доступных направлений. Обратитесь к администратору G7, чтобы назначить роль.
      </div>
    `;
    return;
  }

  branchGrid.innerHTML = availableBranches.map((branch) => `
    <a class="branchCard" href="${branch.href}">
      <div>
        <div class="branchTop">
          <div>
            <p class="eyebrow">Направление</p>
            <h2>${branch.title}</h2>
          </div>
          <div class="branchIcon">${renderIcon(branch.icon)}</div>
        </div>
        <p>${branch.description}</p>
      </div>
      <span class="rolePill">Ваша роль: ${ROLE_LABELS[profile.role] || profile.role}</span>
    </a>
  `).join("");
}

function renderProfile(profile, user) {
  const availableBranches = BRANCHES.filter((branch) => canSeeBranch(profile, branch));
  const branchNames = availableBranches.map((branch) => BRANCH_LABELS[branch.id]).join(", ") || "Не назначено";
  const roleLabel = ROLE_LABELS[profile.role] || profile.role || "Не назначена";

  document.getElementById("welcomeTitle").textContent = `Добро пожаловать, ${profile.full_name}`;
  document.getElementById("welcomeText").textContent = "Мы начинаем с двух направлений: бутики и интернет-бутик. Доступные иконки зависят от роли пользователя.";
  document.getElementById("profileName").textContent = profile.full_name || user.email || "Пользователь G7";
  document.getElementById("profileRole").textContent = roleLabel;
  document.getElementById("profileBranch").textContent = branchNames;

  renderNav(availableBranches);
  renderBranches(profile, availableBranches);
}

const { data } = await supabase.auth.getSession();
if (!data.session) location.replace("../index.html");

const profile = await loadProfile(data.session.user);
if (!profile.is_active) {
  await supabase.auth.signOut();
  location.replace("../index.html?blocked=1");
}

renderProfile(profile, data.session.user);
loading.style.display = "none";
app.style.display = "block";
</script>
</body>
</html>
